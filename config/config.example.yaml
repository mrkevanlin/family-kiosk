# Family Kiosk configuration
# Copy to /etc/family-kiosk/config.yaml on the G10 (or config/config.yaml for local dev).

timezone: America/New_York

# Parent PIN for dashboard login and kiosk "Parent" exit control.
# Change this before first use.
parent_pin: "1234"

# Kid Linux username (set by the installer to the child account you choose).
kid_username: kid

# Computer hours — kid can only use the machine during these windows.
# Days: monday, tuesday, wednesday, thursday, friday, saturday, sunday
hours:
  monday:    { start: "16:00", end: "20:00" }
  tuesday:   { start: "16:00", end: "20:00" }
  wednesday: { start: "16:00", end: "20:00" }
  thursday:  { start: "16:00", end: "20:00" }
  friday:    { start: "16:00", end: "20:00" }
  saturday:  { start: "09:00", end: "20:00" }
  sunday:    { start: "09:00", end: "20:00" }

# Domains always reachable even when general internet is off.
# Used by the allowlist proxy / nftables helper.
always_allow_domains:
  # Local familyd (picker / parent dashboard)
  - localhost
  - 127.0.0.1
  - family-pc.local
  # Google / GSuite homework (SafeSearch forced via Chromium policies)
  - google.com
  - www.google.com
  - accounts.google.com
  - myaccount.google.com
  - classroom.google.com
  - docs.google.com
  - drive.google.com
  - sheets.google.com
  - slides.google.com
  - forms.google.com
  - mail.google.com
  - gmail.com
  - www.gmail.com
  - calendar.google.com
  - meet.google.com
  - chat.google.com
  - sites.google.com
  - jamboard.google.com
  - keep.google.com
  - photos.google.com
  - books.google.com
  - scholar.google.com
  - translate.google.com
  - maps.google.com
  - www.google.com
  - encrypted.google.com
  - clients1.google.com
  - clients2.google.com
  - clients3.google.com
  - clients4.google.com
  - clients5.google.com
  - clients6.google.com
  - apis.google.com
  - oauthaccountmanager.googleapis.com
  - www.googleapis.com
  - googleapis.com
  - gstatic.com
  - www.gstatic.com
  - fonts.gstatic.com
  - fonts.googleapis.com
  - lh3.googleusercontent.com
  - lh4.googleusercontent.com
  - lh5.googleusercontent.com
  - lh6.googleusercontent.com
  - googleusercontent.com
  - ssl.gstatic.com
  - youtube.com
  - www.youtube.com
  - youtu.be
  - ytimg.com
  - i.ytimg.com
  - ggpht.com
  # Optional school tools
  - www.khanacademy.org
  - khanacademy.org
  - cdn.kastatic.org
  # mBlock web IDE + CDN
  - ide.mblock.cc
  - ide.makeblock.com
  - mblock.cc
  - www.mblock.cc
  - makeblock.com
  - www.makeblock.com
  - dl.makeblock.com
  - static.makeblock.com
  - cdn.makeblock.com

# Homework starts here (Google login / search with SafeSearch policies).
homework_start_url: "https://www.google.com/?safe=active&ssui=on"

# Homework Chromium profile — URL patterns (informational + browser preview).
# Network enforcement uses always_allow_domains + Chromium SafeSearch policies.
homework_url_allowlist:
  - "https://www.google.com/*"
  - "https://google.com/*"
  - "https://accounts.google.com/*"
  - "https://classroom.google.com/*"
  - "https://docs.google.com/*"
  - "https://drive.google.com/*"
  - "https://sheets.google.com/*"
  - "https://slides.google.com/*"
  - "https://forms.google.com/*"
  - "https://mail.google.com/*"
  - "https://calendar.google.com/*"
  - "https://meet.google.com/*"
  - "https://www.youtube.com/*"
  - "https://youtube.com/*"
  - "https://www.khanacademy.org/*"
  - "https://khanacademy.org/*"

# mBlock Chromium profile start URL
mblock_url: "https://ide.mblock.cc"

# Allowed request durations (minutes)
session_durations: [15, 30, 60]

# HTTP bind
host: "0.0.0.0"
port: 8787

# Paths (override for local Mac development)
data_dir: "data"
static_dir: "static"
templates_dir: "templates"

# When true, skip nftables helper (Mac/dev). On Ubuntu install this is false.
dry_run_network: true
