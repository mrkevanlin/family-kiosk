[project]
name = "family-kiosk"
version = "0.1.0"
description = "Ubuntu family computer kiosk with hours and parent-approved internet"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.11.0",
  "python-multipart>=0.0.20",
  "jinja2>=3.1.5",
  "itsdangerous>=2.2.0",
]

[project.scripts]
familyd = "familyd.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
